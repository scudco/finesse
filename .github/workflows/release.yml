name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ext/finesse/go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          gem_version=$(ruby -r ./lib/finesse/version -e "puts Finesse::VERSION")
          if [ "$tag" != "$gem_version" ]; then
            echo "Tag v$tag does not match Finesse::VERSION ($gem_version)"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake ci

      - name: Build Go binaries
        run: bundle exec rake build:all

      - name: Build gem
        run: gem build finesse.gemspec

      - name: Configure RubyGems trusted publisher
        uses: rubygems/configure-rubygems-credentials@main

      - name: Push to RubyGems
        run: gem push finesse-*.gem

      - name: Upload gem to GitHub release
        run: gh release upload "${{ github.event.release.tag_name }}" finesse-*.gem
        env:
          GH_TOKEN: ${{ github.token }}
