name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          cache-dependency-path: ext/finesse/go.sum
          go-version-file: ext/finesse/go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          gem_version=$(ruby -r ./lib/finesse/version -e "puts Finesse::VERSION")
          if [ "$tag" != "$gem_version" ]; then
            echo "Tag v$tag does not match Finesse::VERSION ($gem_version)"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake ci

      - name: Build Go binaries
        run: bundle exec rake build:all

      - name: Build gem
        run: gem build finesse.gemspec

      - name: Configure RubyGems trusted publisher
        # Pinned to a commit: this job can publish the gem. f5a32ef is the
        # commit `@main` resolved to for the v0.1.0.beta4 release.
        uses: rubygems/configure-rubygems-credentials@f5a32efa94076b80b28556b2d3b04cb3707b6df1

      - name: Push to RubyGems
        run: gem push finesse-*.gem

      - name: Upload gem to GitHub release
        run: gh release upload "${{ github.event.release.tag_name }}" finesse-*.gem
        env:
          GH_TOKEN: ${{ github.token }}
